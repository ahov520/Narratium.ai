name: Native Android Debug APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/build-android-native.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/build-android-native.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run unit tests
        working-directory: android-native
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build unsigned debug APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: narratium-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
